# push / PR のたびに秘密情報を機械検査する（素人が見落としても止める）
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  forbidden-path-names:
    name: Forbidden path names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject high-risk file names if tracked
        shell: bash
        run: |
          set -euo pipefail
          # 意図せず tracked されたら CI を落とす（.gitignore の最後の砦）
          patterns=(
            '(^|/)\.env$'
            '(^|/)\.env\.(local|development|production|staging|test|prod|dev)(\.|$)'
            'local\.properties$'
            'google-services\.json$'
            'GoogleService-Info\.plist$'
            '\.jks$'
            '\.keystore$'
            '\.p12$'
            '\.pem$'
            'upload-key\.properties$'
            'key\.properties$'
            'id_rsa'
            'id_ed25519'
            'credentials\.json$'
            'serviceAccount.*\.json$'
            '\.openai/'
            '\.wrangler/'
          )
          bad=0
          while IFS= read -r f; do
            for p in "${patterns[@]}"; do
              if [[ "$f" =~ $p ]]; then
                echo "::error file=$f::Forbidden path is tracked: $f"
                bad=1
              fi
            done
          done < <(git ls-files)
          if [[ "$bad" -ne 0 ]]; then
            echo "High-risk files are tracked. Remove them from git and rotate any exposed secrets."
            exit 1
          fi
          echo "No forbidden path names in the tracked tree."

  pattern-scan:
    name: Pattern scan (tracked text)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for common secret / PII patterns
        shell: bash
        run: |
          set -euo pipefail
          # gitleaks の補助。素人がコミットしがちな実害パターンを落とす
          fail=0
          scan() {
            local name="$1"
            local regex="$2"
            # バイナリ・lock は除外
            if git grep -nI -E "$regex" -- \
              ':!package-lock.json' \
              ':!**/package-lock.json' \
              ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.webp' \
              ':!*.mp4' ':!*.jar' ':!*.svg' \
              ':!.gitleaks.toml' \
              ':!docs/security/**' \
              ':!SECURITY.md' \
              ':!scripts/**' \
              2>/dev/null; then
              echo "::error::Pattern hit: $name"
              fail=1
            else
              echo "OK: $name"
            fi
          }
          scan "AWS access key id" 'AKIA[0-9A-Z]{16}'
          scan "GitHub PAT (classic)" 'ghp_[A-Za-z0-9]{36}'
          scan "GitHub PAT (fine-grained)" 'github_pat_[A-Za-z0-9_]{20,}'
          scan "OpenAI-like sk- key" 'sk-[A-Za-z0-9]{20,}'
          scan "Private key header" '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----'
          scan "Windows user home path" 'C:\\\\Users\\\\[A-Za-z0-9._-]+'
          scan "macOS user home path" '/Users/[A-Za-z0-9._-]+/'
          # 実メール（docs の説明用 @ は除外済みディレクトリ）
          # ドメイン先頭は英字（@2x.png 誤検知防止）
          scan "Email address" '[A-Za-z0-9._%+-]+@[A-Za-z][A-Za-z0-9-]*(\.[A-Za-z0-9-]+)+'
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
